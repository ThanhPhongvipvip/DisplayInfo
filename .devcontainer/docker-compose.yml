version: '3.8'

services:
  database:
    image: postgres:15
    container_name: webapp_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: webapp_db
    ports:
      - "5433:5432"
    volumes:
      - ./database:/docker-entrypoint-initdb.d
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webapp_dev
    volumes:
      - .:/workspace
    ports:
      - "3000:3000"
      - "5000:5000"
    environment:
      - DB_HOST=database
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASSWORD=admin123
      - DB_NAME=webapp_db
    depends_on:
      - database
    command: ["tail", "-f", "/dev/null"]
